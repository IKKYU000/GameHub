<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameHub - ค้นหาเกม</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
        :root{
            --bg-dark:#0f172a;--bg-card:#1e293b;--accent:#6366f1;--accent-light:#818cf8;
            --text-primary:#f1f5f9;--text-secondary:#94a3b8;--border:#334155;
            --gradient:linear-gradient(135deg,#6366f1 0%,#8b5cf6 100%);
        }
        body{background:var(--bg-dark);color:var(--text-primary);line-height:1.6;}
        .neon-text{text-shadow:0 0 3px var(--accent-light),0 0 6px var(--accent);}
        header{background:rgba(15,23,42,0.95);border-bottom:1px solid var(--border);padding:1rem 0;position:sticky;top:0;z-index:100;}
        .nav-container{max-width:1200px;margin:0 auto;padding:0 1.5rem;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;}
        .logo{font-size:1.8rem;font-weight:800;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        nav{display:flex;gap:0.3rem;flex-wrap:wrap;}
        .nav-link{color:var(--text-secondary);padding:0.7rem 0.9rem;text-decoration:none;border-radius:6px;transition:all 0.2s;}
        .nav-link:hover,.nav-link.active{background:rgba(99,102,241,0.15);color:var(--accent-light);}
        .container{max-width:800px;margin:0 auto;padding:2rem 1.5rem;}
        h1{font-size:2.4rem;margin-bottom:2rem;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .search-box{background:var(--bg-card);padding:2.5rem;border-radius:16px;border:1px solid var(--border);text-align:center;}
        input{width:100%;max-width:400px;padding:0.9rem 1.2rem;font-size:1rem;border-radius:10px;border:2px solid var(--border);background:var(--bg-dark);color:#fff;outline:none;}
        input:focus{border-color:var(--accent);box-shadow:0 0 8px rgba(99,102,241,0.2);}
        .result-area{margin-top:2rem;text-align:left;max-width:400px;margin-left:auto;margin-right:auto;}
        .game-item{background:var(--bg-dark);padding:1rem;border-radius:10px;border:1px solid var(--border);margin-bottom:0.8rem;transition:0.2s;}
        .game-item:hover{border-color:var(--accent);transform:translateX(5px);}
        .game-item h3{color:var(--accent-light);margin-bottom:0.3rem;}
        .game-item p{color:var(--text-secondary);font-size:0.95rem;}
        .game-item a{color:var(--accent);text-decoration:none;font-size:0.9rem;}
        .highlight{background:rgba(99,102,241,0.3);padding:0 4px;border-radius:4px;color:#fff;}
        footer{text-align:center;padding:2rem;color:var(--text-secondary);border-top:1px solid var(--border);margin-top:3rem;}
    </style>
</head>
<body>

<header>
    <div class="nav-container">
        <div class="logo">🎮 GameHub</div>
        <nav>
            <a class="nav-link" href="index.html">หน้าแรก</a>
            <a class="nav-link" href="games.html">เกม</a>
            <a class="nav-link" href="about.html">เกี่ยวกับเรา</a>
            <a class="nav-link" href="guide.html">คู่มือ</a>
            <a class="nav-link active" href="search.html">ค้นหา</a>
            <a class="nav-link" href="contact.html">ติดต่อ</a>
        </nav>
    </div>
</header>

<div class="container">
    <h1 class="neon-text">🔍 ค้นหาเกม</h1>

    <div class="search-box">
        <h3 style="color:var(--accent-light);margin-bottom:1rem;">พิมพ์ชื่อเกมด้านล่างนี้เลยครับ ✍️</h3>
        <input type="text" id="searchInput" placeholder="พิมพ์ชื่อเกม... เช่น Apex, Valorant..." oninput="doSearch()">

        <div class="result-area" id="resultArea">
            <p style="text-align:center; color:var(--text-secondary); margin-top:2rem;">พิมพ์ชื่อเกมด้านบน ผลลัพธ์จะขึ้นที่นี่ทันทีครับ 😉</p>
        </div>
    </div>
</div>

<footer>
    <p>🎮 GameHub © 2026 | เพื่อการศึกษาเท่านั้น</p>
</footer>

<script>
    const games = [
        {name:'Apex Legends',url:'https://www.ea.com/games/apex-legends',desc:'Battle Royale ใช้ความสามารถพิเศษ ต่อสู้เพื่อความเป็นหนึ่ง'},
        {name:'GSOT',url:'#',desc:'เกมแนวแอคชัน-ผจญภัย'},
        {name:'Honkai Impact',url:'https://honkaiimpact3.hoyoverse.com',desc:'แอคชันสวมบทบาท ต่อสู้ด้วยวัลคิรี'},
        {name:'Valorant',url:'https://playvalorant.com',desc:'ยิงแทคติก 5v5 มีความสามารถพิเศษ'},
        {name:'Wuthering Waves',url:'https://wutheringwaves.kurogame.com',desc:'ต่อสู้เน้นจังหวะและการหลบหลีก'},
        {name:'Marvel Rivals',url:'https://marvelrivals.com',desc:'ฮีโร่มาร์เวลต่อสู้กัน 6v6'},
        {name:'League of Legends',url:'https://www.leagueoflegends.com',desc:'MOBA 5v5 ต่อสู้ทำลายฐาน'},
        {name:'Genshin Impact',url:'https://genshin.hoyoverse.com',desc:'ผจญภัยโลกแฟนตาซี ใช้พลังธาตุ'},
        {name:'Mobile Legends',url:'https://m.mobilelegends.com',desc:'MOBA บนมือถือยอดฮิต'},
        {name:'PUBG',url:'https://www.pubg.com',desc:'Battle Royale เหลือรอดเป็นคนสุดท้าย'},
        {name:'Fortnite',url:'https://www.fortnite.com',desc:'สร้างและต่อสู้บนเกาะ'},
        {name:'Elden Ring',url:'https://www.bandainamcoent.com/games/elden-ring',desc:'แอคชันผจญภัยที่ท้าทาย'}
    ];

    function highlightText(text, keyword) {
        if (!keyword) return text;
        const regex = new RegExp(`(${keyword})`, 'gi');
        return text.replace(regex, '<span class="highlight">$1</span>');
    }

    function doSearch(){
        const kw = document.getElementById('searchInput').value.trim();
        const area = document.getElementById('resultArea');

        if(!kw){
            area.innerHTML='<p style="text-align:center; color:var(--text-secondary); margin-top:2rem;">พิมพ์ชื่อเกมด้านบน ผลลัพธ์จะขึ้นที่นี่ทันทีครับ 😉</p>';
            return;
        }

        const found = games.filter(g=>g.name.toLowerCase().includes(kw.toLowerCase()));

        if(found.length===0){
            area.innerHTML='<p style="text-align:center; color:#ff6b6b; margin-top:2rem;">❌ ไม่พบเกมที่มี "'+kw+'"</p>';
            return;
        }

        area.innerHTML = found.map(g=>`
            <div class="game-item">
                <h3>${highlightText(g.name, kw)}</h3>
                <p>${g.desc}</p>
                <a href="${g.url}" target="_blank">🌐 เข้าเว็บหลัก →</a>
            </div>
        `).join('');
    }
</script>

</body>
</html>
